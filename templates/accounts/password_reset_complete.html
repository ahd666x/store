{% extends 'base.html' %}

{% block title %}رمز عبور تغییر کرد{% endblock %}

{% block content %}
<div class="section-container section-padding">
  <div class="max-w-md mx-auto">
    <div class="card p-8 text-center">
      <div class="mx-auto h-16 w-16 bg-success-100 rounded-full flex items-center justify-center mb-4">
        <svg class="h-8 w-8 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-stone-900 mb-2">رمز عبور شما تغییر کرد</h2>
      <p class="text-stone-600 mb-6">اکنون می‌توانید با رمز عبور جدید وارد شوید.</p>
      <a href="{% url 'accounts:login' %}" class="btn-primary w-full">
        ورود
      </a>
    </div>
  </div>
</div>
{% endblock %}
