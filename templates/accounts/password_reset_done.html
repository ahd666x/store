{% extends 'base.html' %}

{% block title %}ایمیل بازیابی ارسال شد{% endblock %}

{% block content %}
<div class="section-container section-padding">
  <div class="max-w-md mx-auto">
    <div class="card p-8 text-center">
      <div class="mx-auto h-16 w-16 bg-success-100 rounded-full flex items-center justify-center mb-4">
        <svg class="h-8 w-8 text-success-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
        </svg>
      </div>
      <h2 class="text-2xl font-bold text-stone-900 mb-2">ایمیل بازیابی ارسال شد</h2>
      <p class="text-stone-600 mb-6">لینک بازیابی رمز عبور به ایمیل شما ارسال شد. لطفا صندوق ورودی خود را بررسی کنید.</p>
      <a href="{% url 'accounts:login' %}" class="btn-primary w-full">
        بازگشت به ورود
      </a>
    </div>
  </div>
</div>
{% endblock %}
