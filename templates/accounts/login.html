{% extends 'base.html' %}

{% block title %}ورود{% endblock %}

{% block content %}
<h1>ورود به حساب کاربری</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">ورود</button>
</form>
<p>
    <a href="{% url 'accounts:password_reset' %}">رمز عبور را فراموش کرده‌اید؟</a>
</p>
<p>
    <a href="{% url 'accounts:register' %}">ثبت‌نام</a> |
    <a href="{% url 'accounts:otp_request' %}">ورود با OTP</a>
</p>
{% endblock %}
