{% extends 'base.html' %}

{% block title %}لیست تعطیلات{% endblock %}

{% block content %}
<h1>لیست تعطیلات</h1>
<table>
    <thead>
        <tr>
            <th>تاریخ</th>
            <th>مناسبت</th>
        </tr>
    </thead>
    <tbody>
        {% for holiday in holidays %}
            <tr>
                <td>{{ holiday.date }}</td>
                <td>{{ holiday.description|default:"-" }}</td>
            </tr>
        {% empty %}
            <tr><td colspan="2">هنوز تعطیلی تعریف نشده است.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
