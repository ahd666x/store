{% extends 'production/base.html' %}
{% load static %}
{% block title %}افزودن آیتم{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">افزودن آیتم به سفارش #{{ order.id }}</h5>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}
                        {{ form.as_p }}
                        <div class="d-flex justify-content-between mt-4">
                            <a href="{% url 'admin_edit_order' order_id=order.id %}" class="btn btn-secondary">
                                بازگشت
                            </a>
                            <button type="submit" class="btn btn-primary">
                                ذخیره آیتم
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
