{% extends 'production/base.html' %}

{% block content %}

<h3>گزارش کارگرها</h3>

<table class="table-modern border border-stone-200">
<thead class="bg-stone-50">
    <tr>
        <th class="px-4 py-2 text-right text-xs font-semibold text-stone-500 uppercase">کاربر</th>
        <th class="px-4 py-2 text-right text-xs font-semibold text-stone-500 uppercase">تعداد کار</th>
    </tr>
</thead>
<tbody>
{% for row in data %}
<tr class="border-b border-stone-100 hover:bg-stone-50">
    <td class="px-4 py-2 text-sm text-stone-700">{{ row.user__username }}</td>
    <td class="px-4 py-2 text-sm text-stone-700">{{ row.count }}</td>
</tr>
{% endfor %}
</tbody>
</table>

{% endblock %}
