{% comment %} Search Component - دکارو {% endcomment %}
{% comment %} Purpose: Reusable search input with icon {% endcomment %}
{% comment %} Variables: action_url, placeholder, name (default: q), value, class {% endcomment %}

<form action="{{ action_url|default:'#' }}" method="get" class="flex items-center relative {{ class|default:'' }}">
    <input 
        type="text" 
        name="{{ name|default:'q' }}" 
        placeholder="{{ placeholder|default:'جستجو...' }}" 
        value="{{ value|default:'' }}" 
        aria-label="{{ placeholder|default:'جستجو' }}" 
        class="form-input w-full pe-10"
    >
    <button type="submit" class="absolute end-1 top-1/2 -translate-y-1/2 text-stone-400 hover:text-primary-600" aria-label="جستجو">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
        </svg>
    </button>
</form>
