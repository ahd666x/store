{% load jformat %}
<div class="divide-y divide-stone-200">
  {% for item in items %}
    <div class="p-4 sm:p-6 flex items-start gap-4 sm:gap-6">
      {% if item.product.images.all %}
        <img src="{{ item.product.images.all.0.image.url }}" alt="{{ item.product.name }}" class="w-16 h-16 sm:w-20 sm:h-20 object-cover rounded-lg flex-shrink-0">
      {% else %}
        <div class="w-16 h-16 sm:w-20 sm:h-20 bg-stone-100 rounded-lg flex items-center justify-center flex-shrink-0">
          <svg class="w-6 h-6 sm:w-8 sm:h-8 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
      {% endif %}
      
      <div class="flex-1 min-w-0">
        <h3 class="text-base sm:text-lg font-semibold text-stone-900 truncate">{{ item.product.name }}</h3>
        <p class="text-sm text-stone-500 mt-1">
          تعداد: {{ item.quantity }}
          {% if item.size %}• اندازه: {{ item.size }}{% endif %}
        </p>
        <p class="text-sm text-stone-500">قیمت واحد: {{ item.unit_price }} تومان</p>
      </div>
      
      <div class="text-left flex-shrink-0">
        <p class="text-base sm:text-lg font-bold text-stone-900">{{ item.line_total }} تومان</p>
      </div>
    </div>
  {% endfor %}
</div>
